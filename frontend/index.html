<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AegisDetect - AI Media Authenticity Analyzer</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div class="max-w-2xl mx-auto py-12 px-4">
  <h1 class="text-4xl font-bold text-center">AegisDetect</h1>
  <p class="text-center text-slate-400 mt-2">AI Media Authenticity Analyzer</p>

  <div class="mt-8 flex gap-2 justify-center">
    <button id="tab-img" class="px-6 py-2 rounded-xl font-semibold bg-indigo-600">🖼️ Image</button>
    <button id="tab-aud" class="px-6 py-2 rounded-xl font-semibold bg-slate-700">🎙️ Audio</button>
  </div>

  <div id="pane-img" class="mt-4 bg-slate-900 rounded-2xl p-6 shadow">
    <label class="block text-sm text-slate-300 mb-2">Upload Image (JPG/PNG/WEBP, max 10MB)</label>
    <input id="file" type="file" accept=".jpg,.jpeg,.png,.webp" class="block w-full text-sm" />
    <button id="btn" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-500 rounded-xl py-3 font-semibold">Analyze</button>
    <p id="status" class="mt-3 text-sm text-slate-400"></p>
  </div>

  <div id="pane-aud" class="hidden mt-4 bg-slate-900 rounded-2xl p-6 shadow">
    <label class="block text-sm text-slate-300 mb-2">Upload Audio (WAV best, MP3/M4A ok, max 20MB / 60s)</label>
    <input id="afile" type="file" accept=".wav,.mp3,.m4a" class="block w-full text-sm" />
    <button id="abtn" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 rounded-xl py-3 font-semibold">Analyze Voice</button>
    <p id="astatus" class="mt-3 text-sm text-slate-400"></p>
  </div>

  <div id="result" class="hidden mt-6 bg-slate-900 rounded-2xl p-6 shadow">
    <h2 class="text-xl font-bold text-center" id="r-label">ANALYSIS RESULT</h2>
    <p class="text-center mt-2 text-3xl" id="r-emoji"></p>
    <p class="text-center mt-1 font-semibold" id="r-result"></p>
    <p class="text-center text-slate-300" id="r-conf"></p>
    <div class="mt-4 text-sm">
      <p class="font-semibold mb-1">Detection Indicators</p>
      <ul id="r-ind" class="list-disc ml-5 text-slate-300"></ul>
    </div>
    <div class="mt-4 text-xs text-slate-400">
      <p id="r-meta"></p>
      <p id="r-hash" class="break-all"></p>
      <p class="mt-2 text-amber-300">Confidence is an estimate, not definitive proof.</p>
    </div>
    <a id="r-report" href="#" class="mt-4 inline-block w-full text-center bg-slate-700 hover:bg-slate-600 rounded-xl py-2">View Detailed Report</a>
  </div>
</div>

<script>
const API = "http://127.0.0.1:8000/api/v1";
const tabImg = document.getElementById("tab-img"), tabAud = document.getElementById("tab-aud");
tabImg.onclick = () => {
  document.getElementById("pane-img").classList.remove("hidden");
  document.getElementById("pane-aud").classList.add("hidden");
  tabImg.className = "px-6 py-2 rounded-xl font-semibold bg-indigo-600";
  tabAud.className = "px-6 py-2 rounded-xl font-semibold bg-slate-700";
};
tabAud.onclick = () => {
  document.getElementById("pane-aud").classList.remove("hidden");
  document.getElementById("pane-img").classList.add("hidden");
  tabAud.className = "px-6 py-2 rounded-xl font-semibold bg-emerald-600";
  tabImg.className = "px-6 py-2 rounded-xl font-semibold bg-slate-700";
};
const btn = document.getElementById("btn");
btn.onclick = async () => {
  const f = document.getElementById("file").files[0];
  const status = document.getElementById("status");
  if (!f) { status.textContent = "Please choose a file first."; return; }
  status.textContent = "Uploading & analyzing...";
  const fd = new FormData();
  fd.append("file", f);
  try {
    const res = await fetch(API + "/analyze/image", { method: "POST", body: fd });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || res.statusText); }
    const d = await res.json();
    status.textContent = "";
    showResult(d);
  } catch (err) {
    status.textContent = "Error: " + err.message + " (is backend running on :8000?)";
  }
};
function showResult(d) {
  document.getElementById("result").classList.remove("hidden");
  const map = { likely_ai: ["🔴", "LIKELY AI-GENERATED"], likely_authentic: ["🟢", "LIKELY AUTHENTIC"], inconclusive: ["🟡", "INCONCLUSIVE"] };
  const [emoji, label] = map[d.result] || ["❓", d.result];
  document.getElementById("r-emoji").textContent = emoji;
  document.getElementById("r-result").textContent = label;
  document.getElementById("r-conf").textContent = "Confidence: " + Math.round(d.ai_probability * 100) + "% AI / " + Math.round(d.authentic_probability * 100) + "% Authentic";
  document.getElementById("r-ind").innerHTML = d.indicators.map(i => `<li>${i.label} (${Math.round(i.score*100)}%)</li>`).join("");
  const metaLine = d.media_type === "audio"
    ? `ID: ${d.analysis_id} | Model: ${d.model_version} | ${d.processing_time_ms}ms | ${d.metadata?.duration_sec ?? "?"}s, ${d.metadata?.sample_rate ?? "?"}Hz`
    : `ID: ${d.analysis_id} | Model: ${d.model_version} | ${d.processing_time_ms}ms | ${d.metadata?.width}x${d.metadata?.height}`;
  document.getElementById("r-meta").textContent = metaLine;
  document.getElementById("r-hash").textContent = "SHA-256: " + d.file_hash_sha256;
  document.getElementById("r-report").href = API + "/analysis/" + d.analysis_id + "/report";
}
const abtn = document.getElementById("abtn");
abtn.onclick = async () => {
  const f = document.getElementById("afile").files[0];
  const status = document.getElementById("astatus");
  if (!f) { status.textContent = "Please choose an audio file first."; return; }
  status.textContent = "Uploading & analyzing voice...";
  const fd = new FormData();
  fd.append("file", f);
  try {
    const res = await fetch(API + "/analyze/audio", { method: "POST", body: fd });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || res.statusText); }
    const d = await res.json();
    status.textContent = "";
    showResult(d);
  } catch (err) {
    status.textContent = "Error: " + err.message + " (is backend running on :8000?)";
  }
};
</script>
</body>
</html>
